<!--
Paso 1
En una lección anterior, aprendiste sobre los elementos svg y cómo a menudo se usan como íconos en proyectos. En bases de código reales, normalmente confiarías en bibliotecas de íconos, por lo que no necesitas crear elementos svg desde cero. Sin embargo, en este taller, construirás un ícono de corazón para aprender sobre los atributos principales que se usan dentro de un elemento svg.

Comienza creando un elemento svg en la página.

Paso 2
Debes anidar un elemento path dentro de tu elemento svg para darle forma a la imagen.

Crea un elemento path.

Paso 3
El elemento path necesita que se defina su forma. Ahí es donde entra el atributo d. Se usa para crear una serie de letras de comando y números que dibujan una forma.

Estas letras representan comandos como move to, draw line y close, mientras que los números representan coordenadas.

Establece el atributo d de la forma de corazón a M12 21s-6-4.35-9.33-8.22C-.5 7.39 3.24 1 8.4 4.28 10.08 5.32 12 7.5 12 7.5s1.92-2.18 3.6-3.22C20.76 1 24.5 7.39 21.33 12.78 18 16.65 12 21 12 21z.

Paso 4
El siguiente paso es establecer los atributos width y height para el elemento svg. Como estás creando un ícono, ambos valores deben ser pequeños.

Establece ambos valores en 24.

Paso 5
Estás acercándote. Ahora, mira este ejemplo:

<svg viewBox="0 0 50 50">
</svg>
El atributo viewBox controla qué parte de la imagen es visible dentro del SVG.

Los dos primeros números (0 0) establecen la posición inicial del viewBox: la esquina superior izquierda (x e y).
Los siguientes dos números (50 50) definen el ancho y alto del viewBox.
Establece el atributo viewBox a 0 0 24 24.

Paso 6
El ícono de corazón está casi listo. Solo necesitas colorearlo de rojo. Para eso, establece el atributo fill del elemento svg en red.

¡Felicidades por terminar este taller!
-->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Heart Icon</title>
  </head>
  <body>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="red">
      <path
        d="M12 21s-6-4.35-9.33-8.22C-.5 7.39 3.24 1 8.4 4.28 10.08 5.32 12 7.5 12 7.5s1.92-2.18 3.6-3.22C20.76 1 24.5 7.39 21.33 12.78 18 16.65 12 21 12 21z"
      ></path>
    </svg>
  </body>
</html>
